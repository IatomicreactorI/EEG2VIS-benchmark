
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': 'z', 'y_data': 2}, {'x_data': 'y', 'y_data': 2}, {'x_data': 'w', 'y_data': 2}, {'x_data': 'l', 'y_data': 2}, {'x_data': 'k', 'y_data': 2}, {'x_data': 'd', 'y_data': 2}, {'x_data': 't', 'y_data': 1}, {'x_data': 'r', 'y_data': 1}, {'x_data': 'q', 'y_data': 1}, {'x_data': 'o', 'y_data': 1}, {'x_data': 'j', 'y_data': 1}, {'x_data': 'i', 'y_data': 1}, {'x_data': 'c', 'y_data': 1}, {'x_data': 'b', 'y_data': 1}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'Investor_details', 'sort': {'op': 'sum', 'field': 'y_data', 'order': 'descending'}}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'COUNT(Investor_details)'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
