
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': 'USA', 'y_data': 523.0600000000003}, {'x_data': 'Canada', 'y_data': 303.95999999999987}, {'x_data': 'France', 'y_data': 195.09999999999997}, {'x_data': 'Brazil', 'y_data': 190.1}, {'x_data': 'Germany', 'y_data': 156.48}, {'x_data': 'United Kingdom', 'y_data': 112.86}, {'x_data': 'Czech Republic', 'y_data': 90.24}, {'x_data': 'Portugal', 'y_data': 77.23999999999998}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'billing_country', 'sort': {'op': 'sum', 'field': 'y_data', 'order': 'ascending'}}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'SUM(total)'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
