
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': 'David CV', 'y_data': 6345}, {'x_data': 'Fall Sails', 'y_data': 7509}, {'x_data': 'How to cook pasta', 'y_data': 2045}, {'x_data': 'Humanity: a fact', 'y_data': 3479}, {'x_data': 'Joe CV', 'y_data': 2294}, {'x_data': 'John CV', 'y_data': 5924}, {'x_data': 'Learning Database', 'y_data': 3769}, {'x_data': 'Learning English', 'y_data': 1864}, {'x_data': 'Learning Japanese', 'y_data': 2910}, {'x_data': 'Life about Claude Monet', 'y_data': 1219}, {'x_data': 'Relationships between History and Arts', 'y_data': 9948}, {'x_data': 'Research about Art history', 'y_data': 8208}, {'x_data': 'Spring Sails', 'y_data': 3289}, {'x_data': 'Summer Sails', 'y_data': 6661}, {'x_data': 'Winter Sails', 'y_data': 8623}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'document_name', 'sort': {'op': 'sum', 'field': 'y_data', 'order': 'ascending'}}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'access_count'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
