
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .container {
            margin-left: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
        }
        .nlquery {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container"><table><tr><th>Course_ID</th><th>Teacher_ID</th><th>Grade</th></tr><tr><td>2</td><td>5</td><td>1</td></tr><tr><td>2</td><td>3</td><td>3</td></tr><tr><td>3</td><td>2</td><td>5</td></tr><tr><td>4</td><td>6</td><td>7</td></tr><tr><td>5</td><td>6</td><td>1</td></tr><tr><td>10</td><td>7</td><td>4</td></tr></table></div>
</body>
</html>
