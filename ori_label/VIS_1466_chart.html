
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': 'Columbia Masterworks', 'y_data': 1}, {'x_data': 'Decca Records', 'y_data': 2}, {'x_data': 'Delos Records', 'y_data': 1}, {'x_data': 'Deutsche Grammophon', 'y_data': 1}, {'x_data': 'EMI', 'y_data': 1}, {'x_data': 'Koch Records / Naxos Records', 'y_data': 1}, {'x_data': 'Kultur', 'y_data': 1}, {'x_data': 'Mercury Records', 'y_data': 1}, {'x_data': 'Philips', 'y_data': 1}, {'x_data': 'Philips Classics Records', 'y_data': 1}, {'x_data': 'RCA', 'y_data': 1}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'Record_Company', 'sort': 'descending'}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'COUNT(Record_Company)'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
