
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .container {
            margin-left: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
        }
        .nlquery {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container"><table><tr><th>Allergy</th><th>AllergyType</th></tr><tr><td>Eggs</td><td>food</td></tr><tr><td>Nuts</td><td>food</td></tr><tr><td>Milk</td><td>food</td></tr><tr><td>Shellfish</td><td>food</td></tr><tr><td>Anchovies</td><td>food</td></tr><tr><td>Wheat</td><td>food</td></tr><tr><td>Soy</td><td>food</td></tr><tr><td>Ragweed</td><td>environmental</td></tr><tr><td>Tree Pollen</td><td>environmental</td></tr><tr><td>Grass Pollen</td><td>environmental</td></tr><tr><td>Cat</td><td>animal</td></tr><tr><td>Dog</td><td>animal</td></tr><tr><td>Rodent</td><td>animal</td></tr><tr><td>Bee Stings</td><td>animal</td></tr></table></div>
</body>
</html>
