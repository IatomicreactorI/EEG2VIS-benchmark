
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': 'Commonwealth of the US', 'y_data': 3947000}, {'x_data': 'Constitutional Monarchy (Emirate)', 'y_data': 1972000}, {'x_data': 'Constitutional Monarchy, Federation', 'y_data': 82516000}, {'x_data': 'Dependent Territory of the UK', 'y_data': 193050}, {'x_data': 'Emirate Federation', 'y_data': 2441000}, {'x_data': 'Federation', 'y_data': 7160400}, {'x_data': 'Monarchy (Emirate)', 'y_data': 617000}, {'x_data': 'Monarchy (Sultanate)', 'y_data': 2870000}, {'x_data': 'Nonmetropolitan Territory of France', 'y_data': 464000}, {'x_data': 'Nonmetropolitan Territory of The Netherlands', 'y_data': 320000}, {'x_data': 'Overseas Department of France', 'y_data': 1731000}, {'x_data': 'Parliamentary Coprincipality', 'y_data': 78000}, {'x_data': 'Part of Denmark', 'y_data': 99000}, {'x_data': 'Socialistic Republic', 'y_data': 115072000}, {'x_data': 'Socialistic State', 'y_data': 5605000}, {'x_data': 'Special Administrative Region of China', 'y_data': 7255000}, {'x_data': 'US Territory', 'y_data': 329000}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'GovernmentForm', 'sort': 'ascending'}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'sum(Population)'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
