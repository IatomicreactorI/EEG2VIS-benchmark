
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': 'Barbera', 'y_data': 1}, {'x_data': 'Cabernet Franc', 'y_data': 1}, {'x_data': 'Cabernet Sauvingnon', 'y_data': 68}, {'x_data': 'Chardonnay', 'y_data': 104}, {'x_data': 'Grenache', 'y_data': 10}, {'x_data': 'Malbec', 'y_data': 1}, {'x_data': 'Marsanne', 'y_data': 1}, {'x_data': 'Merlot', 'y_data': 10}, {'x_data': 'Petite Sirah', 'y_data': 6}, {'x_data': 'Pinot Noir', 'y_data': 109}, {'x_data': 'Roussanne', 'y_data': 1}, {'x_data': 'Sangiovese', 'y_data': 1}, {'x_data': 'Sauvignon Blanc', 'y_data': 46}, {'x_data': 'Syrah', 'y_data': 61}, {'x_data': 'Tempranillo', 'y_data': 1}, {'x_data': 'Viognier', 'y_data': 1}, {'x_data': 'Zinfandel', 'y_data': 78}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'Grape', 'sort': {'op': 'sum', 'field': 'y_data', 'order': 'descending'}}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'COUNT(Grape)'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
