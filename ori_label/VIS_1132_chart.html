
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': 'Tiffany', 'y_data': 9}, {'x_data': 'Logan', 'y_data': 12}, {'x_data': 'Kyle', 'y_data': 12}, {'x_data': 'Kris', 'y_data': 10}, {'x_data': 'Jordan', 'y_data': 21}, {'x_data': 'John', 'y_data': 12}, {'x_data': 'Jessica', 'y_data': 11}, {'x_data': 'Haley', 'y_data': 10}, {'x_data': 'Gabriel', 'y_data': 20}, {'x_data': 'Cassandra', 'y_data': 9}, {'x_data': 'Brittany', 'y_data': 10}, {'x_data': 'Austin', 'y_data': 11}, {'x_data': 'Andrew', 'y_data': 10}, {'x_data': 'Alexis', 'y_data': 11}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'name', 'sort': 'descending'}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'SUM(grade)'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
