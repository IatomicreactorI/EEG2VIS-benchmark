
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .container {
            margin-left: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
        }
        .nlquery {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container"><table><tr><th>Name</th><th>Phone_ID</th><th>Memory_in_G</th><th>Carrier</th><th>Price</th></tr><tr><td>IPhone 5s</td><td>1</td><td>32</td><td>Sprint</td><td>320.0</td></tr><tr><td>IPhone 6</td><td>5</td><td>128</td><td>Sprint</td><td>480.0</td></tr><tr><td>IPhone 6s</td><td>2</td><td>128</td><td>TMobile</td><td>699.0</td></tr><tr><td>IPhone 7</td><td>4</td><td>16</td><td>TMobile</td><td>899.0</td></tr><tr><td>IPhone X</td><td>3</td><td>64</td><td>TMobile</td><td>1000.0</td></tr></table></div>
</body>
</html>
