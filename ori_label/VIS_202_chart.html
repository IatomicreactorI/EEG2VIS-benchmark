
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': 'Administration', 'y_data': 1}, {'x_data': 'Human Resources', 'y_data': 1}, {'x_data': 'Public Relations', 'y_data': 1}, {'x_data': 'Accounting', 'y_data': 2}, {'x_data': 'Marketing', 'y_data': 2}, {'x_data': 'Executive', 'y_data': 3}, {'x_data': 'IT', 'y_data': 5}, {'x_data': 'Finance', 'y_data': 6}, {'x_data': 'Purchasing', 'y_data': 6}, {'x_data': 'Sales', 'y_data': 34}, {'x_data': 'Shipping', 'y_data': 45}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'DEPARTMENT_NAME', 'sort': {'op': 'sum', 'field': 'y_data', 'order': 'ascending'}}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'COUNT(*)'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
