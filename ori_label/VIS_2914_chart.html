
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': 'Colorado', 'y_data': 1}, {'x_data': 'District of Columbia', 'y_data': 1}, {'x_data': 'Idaho', 'y_data': 1}, {'x_data': 'Illinois', 'y_data': 1}, {'x_data': 'Kentucky', 'y_data': 2}, {'x_data': 'Louisiana', 'y_data': 1}, {'x_data': 'Maine', 'y_data': 1}, {'x_data': 'Maryland', 'y_data': 1}, {'x_data': 'Nevada', 'y_data': 1}, {'x_data': 'Oklahoma', 'y_data': 1}, {'x_data': 'Oregon', 'y_data': 1}, {'x_data': 'SouthDakota', 'y_data': 1}, {'x_data': 'Vermont', 'y_data': 1}, {'x_data': 'Virginia', 'y_data': 1}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'state_province_county', 'sort': 'ascending'}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'count(*)'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
