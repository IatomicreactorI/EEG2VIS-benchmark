
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': 'Astronomy', 'y_data': 617253.94}, {'x_data': 'Athletics', 'y_data': 734550.7}, {'x_data': 'Biology', 'y_data': 647610.55}, {'x_data': 'Cybernetics', 'y_data': 794541.46}, {'x_data': 'English', 'y_data': 611042.66}, {'x_data': 'Finance', 'y_data': 866831.75}, {'x_data': 'History', 'y_data': 699140.86}, {'x_data': 'Languages', 'y_data': 601283.6}, {'x_data': 'Math', 'y_data': 777605.11}, {'x_data': 'Physics', 'y_data': 942162.76}, {'x_data': 'Pol. Sci.', 'y_data': 573745.09}, {'x_data': 'Psychology', 'y_data': 848175.04}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'dept_name', 'sort': 'ascending'}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'budget'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
