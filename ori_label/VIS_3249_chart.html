
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': 'Accounting', 'y_data': 48716.25}, {'x_data': 'Astronomy', 'y_data': 79070}, {'x_data': 'Athletics', 'y_data': 77097.6}, {'x_data': 'Biology', 'y_data': 61287}, {'x_data': 'Comp. Sci.', 'y_data': 98133}, {'x_data': 'Cybernetics', 'y_data': 96345.75}, {'x_data': 'Elec. Eng.', 'y_data': 74162.25}, {'x_data': 'English', 'y_data': 72088.5}, {'x_data': 'Finance', 'y_data': 105311}, {'x_data': 'Geology', 'y_data': 99382}, {'x_data': 'Languages', 'y_data': 57421.333333333336}, {'x_data': 'Marketing', 'y_data': 84097}, {'x_data': 'Mech. Eng.', 'y_data': 79812.5}, {'x_data': 'Physics', 'y_data': 114576}, {'x_data': 'Pol. Sci.', 'y_data': 100052.66666666667}, {'x_data': 'Psychology', 'y_data': 61142.5}, {'x_data': 'Statistics', 'y_data': 67795}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'dept_name', 'sort': {'op': 'sum', 'field': 'y_data', 'order': 'descending'}}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'AVG(salary)'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
