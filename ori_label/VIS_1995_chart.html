
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': 'Sonoma', 'y_data': 11}, {'x_data': 'Napa', 'y_data': 11}, {'x_data': 'N/A', 'y_data': 8}, {'x_data': 'Santa Barbara', 'y_data': 5}, {'x_data': 'San Luis Obispo', 'y_data': 4}, {'x_data': 'Monterey', 'y_data': 3}, {'x_data': 'Lake', 'y_data': 3}, {'x_data': 'Amador', 'y_data': 3}, {'x_data': 'Mendocino', 'y_data': 2}, {'x_data': 'Yolo', 'y_data': 1}, {'x_data': 'Solano', 'y_data': 1}, {'x_data': 'San Joaquin', 'y_data': 1}, {'x_data': 'San Benito', 'y_data': 1}, {'x_data': 'Contra Costa', 'y_data': 1}, {'x_data': 'Calaveras', 'y_data': 1}, {'x_data': 'Alameda', 'y_data': 1}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'County', 'sort': {'op': 'sum', 'field': 'y_data', 'order': 'descending'}}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'COUNT(County)'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
