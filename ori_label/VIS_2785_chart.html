
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': 'King', 'y_data': 24000}, {'x_data': 'Russell', 'y_data': 14000}, {'x_data': 'Hartstein', 'y_data': 13000}, {'x_data': 'Higgins', 'y_data': 12000}, {'x_data': 'Greenberg', 'y_data': 12000}, {'x_data': 'Raphaely', 'y_data': 11000}, {'x_data': 'Baer', 'y_data': 10000}, {'x_data': 'Hunold', 'y_data': 9000}, {'x_data': 'Fripp', 'y_data': 8200}, {'x_data': 'Mavris', 'y_data': 6500}, {'x_data': 'Whalen', 'y_data': 4400}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'LAST_NAME', 'sort': {'op': 'sum', 'field': 'y_data', 'order': 'descending'}}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'SALARY'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
