
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': 26, 'y_data': 42, 'classify': 'Bridgeport'}, {'x_data': 26, 'y_data': 33, 'classify': 'Cheshire'}, {'x_data': 44, 'y_data': 50, 'classify': 'Cheshire'}, {'x_data': 18, 'y_data': 29, 'classify': 'Hartford'}, {'x_data': 20, 'y_data': 34, 'classify': 'Hartford'}, {'x_data': 27, 'y_data': 51, 'classify': 'Hartford'}, {'x_data': 18, 'y_data': 35, 'classify': 'Waterbury'}, {'x_data': 24, 'y_data': 45, 'classify': 'Waterbury'}, {'x_data': 27, 'y_data': 51, 'classify': 'Waterbury'}, {'x_data': 41, 'y_data': 67, 'classify': 'Waterbury'}]}, 'mark': 'point', 'encoding': {'x': {'field': 'x_data', 'type': 'quantitative', 'title': 'Time_of_purchase', 'scale': {'zero': 'false'}}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'Age', 'scale': {'zero': 'false'}}, 'color': {'field': 'classify', 'type': 'nominal'}, 'shape': {'field': 'classify', 'type': 'nominal'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
