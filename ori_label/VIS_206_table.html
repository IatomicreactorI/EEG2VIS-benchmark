
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .container {
            margin-left: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
        }
        .nlquery {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container"><table><tr><th>attribute_id</th><th>attribute_name</th><th>attribute_data_type</th></tr><tr><td>1</td><td>Green</td><td>Bool</td></tr><tr><td>2</td><td>Black</td><td>Bool</td></tr><tr><td>3</td><td>Yellow</td><td>Bool</td></tr><tr><td>4</td><td>Sweet</td><td>Bool</td></tr></table></div>
</body>
</html>
