
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': '2007-01-01', 'y_data': 0, 'classify': 'Bunyodkor'}, {'x_data': '2008-01-01', 'y_data': 2, 'classify': 'Bunyodkor'}, {'x_data': '2009-01-01', 'y_data': 1, 'classify': 'Bunyodkor'}, {'x_data': '2010-01-01', 'y_data': 1, 'classify': 'Bunyodkor'}, {'x_data': '2011-01-01', 'y_data': 1, 'classify': 'Bunyodkor'}, {'x_data': '2012-01-01', 'y_data': 3, 'classify': 'Bunyodkor'}, {'x_data': '2013-01-01', 'y_data': 1, 'classify': 'Bunyodkor'}, {'x_data': '2007-01-01', 'y_data': 2, 'classify': 'Pakhtakor'}, {'x_data': '2008-01-01', 'y_data': 1, 'classify': 'Pakhtakor'}, {'x_data': '2009-01-01', 'y_data': 2, 'classify': 'Pakhtakor'}, {'x_data': '2010-01-01', 'y_data': 1, 'classify': 'Pakhtakor'}, {'x_data': '2011-01-01', 'y_data': 1, 'classify': 'Pakhtakor'}, {'x_data': '2012-01-01', 'y_data': 2, 'classify': 'Pakhtakor'}, {'x_data': '2013-01-01', 'y_data': 1, 'classify': 'Pakhtakor'}, {'x_data': '2007-01-01', 'y_data': 1, 'classify': 'Quruvchi'}, {'x_data': '2008-01-01', 'y_data': 0, 'classify': 'Quruvchi'}, {'x_data': '2009-01-01', 'y_data': 0, 'classify': 'Quruvchi'}, {'x_data': '2010-01-01', 'y_data': 0, 'classify': 'Quruvchi'}, {'x_data': '2011-01-01', 'y_data': 0, 'classify': 'Quruvchi'}, {'x_data': '2012-01-01', 'y_data': 0, 'classify': 'Quruvchi'}, {'x_data': '2013-01-01', 'y_data': 0, 'classify': 'Quruvchi'}]}, 'mark': {'type': 'line', 'interpolate': 'monotone'}, 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'Season', 'sort': 'ascending'}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'COUNT(Season)'}, 'color': {'field': 'classify'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
