
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': 'Furniture', 'y_data': 1, 'classify': 'Denesik and Sons Party'}, {'x_data': 'Electronics', 'y_data': 4, 'classify': 'Denesik and Sons Party'}, {'x_data': 'Commen', 'y_data': 5, 'classify': 'Denesik and Sons Party'}, {'x_data': 'Furniture', 'y_data': 0, 'classify': 'Reinger, Hudson and Nolan Group'}, {'x_data': 'Electronics', 'y_data': 1, 'classify': 'Reinger, Hudson and Nolan Group'}, {'x_data': 'Commen', 'y_data': 1, 'classify': 'Reinger, Hudson and Nolan Group'}, {'x_data': 'Furniture', 'y_data': 1, 'classify': 'Robel-Schulist Group'}, {'x_data': 'Electronics', 'y_data': 0, 'classify': 'Robel-Schulist Group'}, {'x_data': 'Commen', 'y_data': 2, 'classify': 'Robel-Schulist Group'}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'Type_of_Thing_Code', 'sort': {'op': 'sum', 'field': 'y_data', 'order': 'ascending'}}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'COUNT(Type_of_Thing_Code)'}, 'color': {'field': 'classify'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
