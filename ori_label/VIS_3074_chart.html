
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': '2018-03-22', 'y_data': 2}, {'x_data': '2018-03-19', 'y_data': 1}, {'x_data': '2018-03-18', 'y_data': 1}, {'x_data': '2018-03-16', 'y_data': 1}, {'x_data': '2018-03-14', 'y_data': 1}, {'x_data': '2018-03-10', 'y_data': 1}, {'x_data': '2018-03-09', 'y_data': 1}, {'x_data': '2018-03-07', 'y_data': 2}, {'x_data': '2018-03-06', 'y_data': 1}, {'x_data': '2018-03-04', 'y_data': 2}, {'x_data': '2018-03-02', 'y_data': 1}, {'x_data': '2018-03-01', 'y_data': 2}, {'x_data': '2018-02-28', 'y_data': 1}, {'x_data': '2018-02-27', 'y_data': 1}, {'x_data': '2018-02-26', 'y_data': 2}]}, 'mark': {'type': 'line', 'interpolate': 'monotone'}, 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'date_of_completion', 'sort': 'descending'}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'COUNT(date_of_completion)'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
