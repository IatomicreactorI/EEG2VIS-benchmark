
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': '2010-01-01', 'y_data': 5, 'classify': 'Fall'}, {'x_data': '2009-01-01', 'y_data': 7, 'classify': 'Fall'}, {'x_data': '2008-01-01', 'y_data': 1, 'classify': 'Fall'}, {'x_data': '2007-01-01', 'y_data': 6, 'classify': 'Fall'}, {'x_data': '2006-01-01', 'y_data': 8, 'classify': 'Fall'}, {'x_data': '2005-01-01', 'y_data': 4, 'classify': 'Fall'}, {'x_data': '2004-01-01', 'y_data': 3, 'classify': 'Fall'}, {'x_data': '2003-01-01', 'y_data': 6, 'classify': 'Fall'}, {'x_data': '2002-01-01', 'y_data': 9, 'classify': 'Fall'}, {'x_data': '2001-01-01', 'y_data': 2, 'classify': 'Fall'}, {'x_data': '2010-01-01', 'y_data': 6, 'classify': 'Spring'}, {'x_data': '2009-01-01', 'y_data': 2, 'classify': 'Spring'}, {'x_data': '2008-01-01', 'y_data': 9, 'classify': 'Spring'}, {'x_data': '2007-01-01', 'y_data': 6, 'classify': 'Spring'}, {'x_data': '2006-01-01', 'y_data': 5, 'classify': 'Spring'}, {'x_data': '2005-01-01', 'y_data': 4, 'classify': 'Spring'}, {'x_data': '2004-01-01', 'y_data': 4, 'classify': 'Spring'}, {'x_data': '2003-01-01', 'y_data': 6, 'classify': 'Spring'}, {'x_data': '2002-01-01', 'y_data': 4, 'classify': 'Spring'}, {'x_data': '2001-01-01', 'y_data': 3, 'classify': 'Spring'}]}, 'mark': {'type': 'line', 'interpolate': 'monotone'}, 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'year', 'sort': 'descending'}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'count(*)'}, 'color': {'field': 'classify'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
