
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': 'Green Bay Packers', 'y_data': 2804}, {'x_data': 'at Oakland Raiders', 'y_data': 1934}, {'x_data': 'Cleveland Browns', 'y_data': 3798}, {'x_data': 'Baltimore Ravens', 'y_data': 6532}, {'x_data': 'at Cincinnati Bengals', 'y_data': 3421}, {'x_data': 'Jacksonville Jaguars', 'y_data': 1232}, {'x_data': 'Tampa Bay Buccaneers', 'y_data': 4798}, {'x_data': 'at Pittsburgh Steelers', 'y_data': 1763}, {'x_data': 'Miami Dolphins', 'y_data': 798}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'Theme', 'sort': {'op': 'sum', 'field': 'y_data', 'order': 'descending'}}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'Sales'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
