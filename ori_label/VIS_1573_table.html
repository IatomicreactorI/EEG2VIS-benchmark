
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .container {
            margin-left: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
        }
        .nlquery {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container"><table><tr><th>PetID</th><th>PetType</th><th>pet_age</th><th>weight</th></tr><tr><td>2001</td><td>cat</td><td>3</td><td>12.0</td></tr><tr><td>2002</td><td>dog</td><td>2</td><td>13.4</td></tr><tr><td>2003</td><td>dog</td><td>1</td><td>9.3</td></tr></table></div>
</body>
</html>
