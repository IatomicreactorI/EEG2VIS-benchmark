
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': 'Frigate', 'y_data': 38}, {'x_data': 'Sloop-of-war', 'y_data': 38}, {'x_data': 'Cutter', 'y_data': 43}, {'x_data': 'Armed schooner', 'y_data': 45}, {'x_data': 'Third-rate ship of the line', 'y_data': 51.33333333333334}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'Class', 'sort': {'op': 'sum', 'field': 'y_data', 'order': 'ascending'}}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'avg(age)'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
