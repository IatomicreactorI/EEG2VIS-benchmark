
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': 'SA_REP', 'y_data': 4261}, {'x_data': 'ST_CLERK', 'y_data': 2440}, {'x_data': 'SH_CLERK', 'y_data': 2440}, {'x_data': 'PU_CLERK', 'y_data': 570}, {'x_data': 'FI_ACCOUNT', 'y_data': 540}, {'x_data': 'IT_PROG', 'y_data': 514}, {'x_data': 'SA_MAN', 'y_data': 500}, {'x_data': 'ST_MAN', 'y_data': 400}, {'x_data': 'AC_ACCOUNT', 'y_data': 205}, {'x_data': 'MK_REP', 'y_data': 201}, {'x_data': 'PR_REP', 'y_data': 101}, {'x_data': 'HR_REP', 'y_data': 101}, {'x_data': 'FI_MGR', 'y_data': 101}, {'x_data': 'AC_MGR', 'y_data': 101}, {'x_data': 'AD_PRES', 'y_data': 0}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'JOB_ID', 'sort': {'op': 'sum', 'field': 'y_data', 'order': 'descending'}}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'SUM(MANAGER_ID)'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
