
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': '2011~2014', 'y_data': 2387512.25}, {'x_data': '1997~2010', 'y_data': 2325929.285714286}, {'x_data': '1983~1996', 'y_data': 1981904.7142857143}, {'x_data': '1969~1982', 'y_data': 1340008.2142857143}, {'x_data': '1955~1968', 'y_data': 1102628.357142857}, {'x_data': '1941~1954', 'y_data': 898984.2857142857}, {'x_data': '1927~1940', 'y_data': 375723.85714285716}, {'x_data': '1913~1926', 'y_data': 248823.35714285713}, {'x_data': '1899~1912', 'y_data': 15462.57142857143}, {'x_data': '1885~1898', 'y_data': 16799.714285714286}, {'x_data': '1871~1884', 'y_data': 5450.428571428572}]}, 'mark': {'type': 'line', 'interpolate': 'monotone'}, 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'year', 'sort': 'descending'}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'AVG(avg(attendance))'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
