
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': '1972-03-31', 'y_data': 5}, {'x_data': '1976-06-15', 'y_data': 7}, {'x_data': '1985-05-13', 'y_data': 7}, {'x_data': '1986-10-14', 'y_data': 1}, {'x_data': '1987-11-05', 'y_data': 3}, {'x_data': '1988-02-01', 'y_data': 8}, {'x_data': '1994-11-15', 'y_data': 9}, {'x_data': '1995-01-01', 'y_data': 1}, {'x_data': '1997-03-10', 'y_data': 7}, {'x_data': '2007-05-28', 'y_data': 2}, {'x_data': '2008-06-08', 'y_data': 3}, {'x_data': '2009-08-18', 'y_data': 8}, {'x_data': '2010-11-26', 'y_data': 7}, {'x_data': '2012-07-03', 'y_data': 7}, {'x_data': '2017-01-06', 'y_data': 8}]}, 'mark': {'type': 'line', 'interpolate': 'monotone'}, 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'Calendar_Date', 'sort': 'descending'}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'Day_Number'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
