
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': 'State', 'y_data': 9.96}, {'x_data': 'Treasury', 'y_data': 11.1}, {'x_data': 'Defense', 'y_data': 439.3}, {'x_data': 'Justice', 'y_data': 23.4}, {'x_data': 'Interior', 'y_data': 10.7}, {'x_data': 'Agriculture', 'y_data': 77.6}, {'x_data': 'Commerce', 'y_data': 6.2}, {'x_data': 'Labor', 'y_data': 59.7}, {'x_data': 'Health and Human Services', 'y_data': 543.2}, {'x_data': 'Housing and Urban Development', 'y_data': 46.2}, {'x_data': 'Transportation', 'y_data': 58}, {'x_data': 'Energy', 'y_data': 21.5}, {'x_data': 'Education', 'y_data': 62.8}, {'x_data': 'Veterans Affairs', 'y_data': 73.2}, {'x_data': 'Homeland Security', 'y_data': 44.6}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'Name', 'sort': 'ascending'}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'Budget_in_Billions'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
