
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': 'Anchovies', 'y_data': 3}, {'x_data': 'Cat', 'y_data': 4}, {'x_data': 'Dog', 'y_data': 3}, {'x_data': 'Eggs', 'y_data': 3}, {'x_data': 'Grass Pollen', 'y_data': 4}, {'x_data': 'Milk', 'y_data': 3}, {'x_data': 'Nuts', 'y_data': 11}, {'x_data': 'Ragweed', 'y_data': 6}, {'x_data': 'Rodent', 'y_data': 1}, {'x_data': 'Shellfish', 'y_data': 4}, {'x_data': 'Soy', 'y_data': 4}, {'x_data': 'Tree Pollen', 'y_data': 13}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'Allergy', 'sort': 'ascending'}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'count(*)'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
