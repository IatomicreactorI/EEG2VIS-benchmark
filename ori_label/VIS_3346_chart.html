
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': 47, 'y_data': 36.5}, {'x_data': 12, 'y_data': 12}, {'x_data': 11, 'y_data': 10.5}, {'x_data': 18, 'y_data': 18}, {'x_data': 27, 'y_data': 27}, {'x_data': 59, 'y_data': 59}, {'x_data': 65, 'y_data': 37.5}, {'x_data': 34, 'y_data': 34}, {'x_data': 51, 'y_data': 51}, {'x_data': 10, 'y_data': 10}, {'x_data': 30, 'y_data': 26}, {'x_data': 92, 'y_data': 92}, {'x_data': 97, 'y_data': 97}, {'x_data': 28, 'y_data': 28}, {'x_data': 12, 'y_data': 11}, {'x_data': 60, 'y_data': 60}, {'x_data': 109, 'y_data': 49.33333333333334}, {'x_data': 113, 'y_data': 113}, {'x_data': 115, 'y_data': 93}, {'x_data': 120, 'y_data': 76}]}, 'mark': 'point', 'encoding': {'x': {'field': 'x_data', 'type': 'quantitative', 'title': 'max(capacity)'}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'avg(capacity)'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
