
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': '2017-04-15', 'y_data': 1}, {'x_data': '2017-04-20', 'y_data': 1}, {'x_data': '2017-05-06', 'y_data': 1}, {'x_data': '2017-06-18', 'y_data': 1}, {'x_data': '2017-06-25', 'y_data': 1}, {'x_data': '2017-07-25', 'y_data': 1}, {'x_data': '2017-09-08', 'y_data': 1}, {'x_data': '2017-10-16', 'y_data': 1}, {'x_data': '2017-10-24', 'y_data': 1}, {'x_data': '2017-10-25', 'y_data': 1}, {'x_data': '2017-12-22', 'y_data': 1}, {'x_data': '2017-12-29', 'y_data': 2}, {'x_data': '2018-01-02', 'y_data': 1}, {'x_data': '2018-01-17', 'y_data': 1}]}, 'mark': {'type': 'line', 'interpolate': 'monotone'}, 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'date_arrived', 'sort': 'ascending'}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'COUNT(date_arrived)'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
