
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': '90’s Music', 'y_data': 1}, {'x_data': 'Audiobooks', 'y_data': 2}, {'x_data': 'Brazilian Music', 'y_data': 1}, {'x_data': 'Classical', 'y_data': 1}, {'x_data': 'Classical 101 - Deep Cuts', 'y_data': 1}, {'x_data': 'Classical 101 - Next Steps', 'y_data': 1}, {'x_data': 'Classical 101 - The Basics', 'y_data': 1}, {'x_data': 'Grunge', 'y_data': 1}, {'x_data': 'Heavy Metal Classic', 'y_data': 1}, {'x_data': 'Movies', 'y_data': 2}, {'x_data': 'Music', 'y_data': 2}, {'x_data': 'Music Videos', 'y_data': 1}, {'x_data': 'On-The-Go 1', 'y_data': 1}, {'x_data': 'TV Shows', 'y_data': 2}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'name', 'sort': 'ascending'}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'COUNT(name)'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
