
<!DOCTYPE html>
<html lang="en">
<head>

    <title>Table</title>

    <script src="controls.js"></script>
    <style>
        .container {
            margin-left: 20px;

        table {
            width: 100%;

        }
        th, td {
            border: 1px solid black;
            padding: 8px;
        }
        .nlquery {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

</html>
