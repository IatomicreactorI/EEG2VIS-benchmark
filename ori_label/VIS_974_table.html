
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .container {
            margin-left: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
        }
        .nlquery {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container"><table><tr><th>cName</th><th>state</th><th>enr</th></tr><tr><td>LSU</td><td>LA</td><td>18000</td></tr><tr><td>ASU</td><td>AZ</td><td>12000</td></tr><tr><td>OU</td><td>OK</td><td>22000</td></tr><tr><td>FSU</td><td>FL</td><td>19000</td></tr></table></div>
</body>
</html>
