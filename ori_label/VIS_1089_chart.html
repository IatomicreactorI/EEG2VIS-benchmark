
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': 'Chile', 'y_data': 6.659999999999998}, {'x_data': 'Hungary', 'y_data': 6.517142857142857}, {'x_data': 'Ireland', 'y_data': 6.517142857142857}, {'x_data': 'Czech Republic', 'y_data': 6.445714285714287}, {'x_data': 'Austria', 'y_data': 6.088571428571428}, {'x_data': 'Finland', 'y_data': 5.945714285714287}, {'x_data': 'Netherlands', 'y_data': 5.802857142857143}, {'x_data': 'India', 'y_data': 5.789230769230769}, {'x_data': 'USA', 'y_data': 5.747912087912091}, {'x_data': 'Norway', 'y_data': 5.659999999999998}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'billing_country', 'sort': {'op': 'sum', 'field': 'y_data', 'order': 'ascending'}}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'AVG(total)'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
