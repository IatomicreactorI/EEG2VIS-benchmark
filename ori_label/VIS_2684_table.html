
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .container {
            margin-left: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
        }
        .nlquery {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container"><table><tr><th>charge_id</th><th>charge_type</th><th>charge_amount</th></tr><tr><td>1</td><td>Daily Accommodation</td><td>98</td></tr><tr><td>2</td><td>Drugs</td><td>322</td></tr><tr><td>3</td><td>Health Check</td><td>640</td></tr></table></div>
</body>
</html>
