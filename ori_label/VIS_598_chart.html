
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': '315 John F. Kennedy Boulevard', 'y_data': 10}, {'x_data': '701 North Franklin Street', 'y_data': 12}, {'x_data': '905 Franklin Street', 'y_data': 17}, {'x_data': '655 North Franklin Street', 'y_data': 22}, {'x_data': '400 North Tampa Street', 'y_data': 36}, {'x_data': '201 North Franklin Street', 'y_data': 39}, {'x_data': '101 East Kennedy Boulevard', 'y_data': 42}, {'x_data': '100 North Tampa Street', 'y_data': 42}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'Street_address', 'sort': 'descending'}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'Floors'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
