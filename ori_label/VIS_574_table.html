
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .container {
            margin-left: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
        }
        .nlquery {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container"><table><tr><th>Code</th><th>Name</th><th>Headquarter</th><th>Founder</th><th>Revenue</th></tr><tr><td>1</td><td>Sony</td><td>Tokyo</td><td>Andy</td><td>120.0</td></tr><tr><td>2</td><td>Creative Labs</td><td>Austin</td><td>Owen</td><td>100.0</td></tr><tr><td>3</td><td>Hewlett-Packard</td><td>Los Angeles</td><td>James</td><td>50.0</td></tr><tr><td>4</td><td>Iomega</td><td>Beijing</td><td>Mary</td><td>200.0</td></tr><tr><td>5</td><td>Fujitsu</td><td>Taiwan</td><td>John</td><td>130.0</td></tr><tr><td>6</td><td>Winchester</td><td>Paris</td><td>Robert</td><td>30.0</td></tr></table></div>
</body>
</html>
