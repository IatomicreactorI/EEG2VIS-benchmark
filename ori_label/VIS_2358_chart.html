
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': 'AT&T Inc.', 'y_data': 268.5}, {'x_data': 'BNP Paribas', 'y_data': 2680.7}, {'x_data': 'Berkshire Hathaway', 'y_data': 372.2}, {'x_data': 'Chevron', 'y_data': 184.8}, {'x_data': 'China Construction Bank', 'y_data': 1408}, {'x_data': 'Citigroup', 'y_data': 1913.9}, {'x_data': 'ExxonMobil', 'y_data': 302.5}, {'x_data': 'Gazprom', 'y_data': 275.9}, {'x_data': 'General Electric', 'y_data': 751.2}, {'x_data': 'HSBC', 'y_data': 2467.9}, {'x_data': 'Industrial and Commercial Bank of China', 'y_data': 1723.5}, {'x_data': 'JPMorgan Chase', 'y_data': 2117.6}, {'x_data': 'PetroChina', 'y_data': 251.3}, {'x_data': 'Petrobras', 'y_data': 313.2}, {'x_data': 'Royal Dutch Shell', 'y_data': 317.2}, {'x_data': 'Santander Group', 'y_data': 1570.6}, {'x_data': 'Total', 'y_data': 192.8}, {'x_data': 'Walmart', 'y_data': 180.7}, {'x_data': 'Wells Fargo', 'y_data': 1258.1}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'name', 'sort': 'descending'}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'Assets_billion'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
