
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': '2017', 'y_data': 0, 'classify': 'American Express'}, {'x_data': '2018', 'y_data': 177130, 'classify': 'American Express'}, {'x_data': '2017', 'y_data': 232825, 'classify': 'Discover Card'}, {'x_data': '2018', 'y_data': 0, 'classify': 'Discover Card'}, {'x_data': '2017', 'y_data': 1327865, 'classify': 'MasterCard'}, {'x_data': '2018', 'y_data': 1204000, 'classify': 'MasterCard'}, {'x_data': '2017', 'y_data': 787370, 'classify': 'Visa'}, {'x_data': '2018', 'y_data': 7343, 'classify': 'Visa'}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'Date_Payment_Made', 'sort': 'descending'}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'SUM(Amount_Payment)'}, 'color': {'field': 'classify'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
