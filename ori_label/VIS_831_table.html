
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .container {
            margin-left: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
        }
        .nlquery {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container"><table><tr><th>name</th><th>age</th><th>city</th><th>gender</th><th>job</th></tr><tr><td>Alice</td><td>25</td><td>new york city</td><td>female</td><td>student</td></tr><tr><td>Bob</td><td>35</td><td>salt lake city</td><td>male</td><td>engineer</td></tr><tr><td>Zach</td><td>45</td><td>austin</td><td>male</td><td>doctor</td></tr><tr><td>Dan</td><td>26</td><td>chicago</td><td>female</td><td>student</td></tr></table></div>
</body>
</html>
