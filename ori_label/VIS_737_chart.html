
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>

    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': '2014-04-09', 'y_data': 21}, {'x_data': '2014-02-20', 'y_data': 2}, {'x_data': '2014-01-22', 'y_data': 140}, {'x_data': '2013-12-31', 'y_data': 96}, {'x_data': '2013-08-25', 'y_data': 1469}, {'x_data': '2013-08-23', 'y_data': 2394}, {'x_data': '2013-08-22', 'y_data': 1473}, {'x_data': '2013-08-21', 'y_data': 1002}, {'x_data': '2013-08-20', 'y_data': 1623}, {'x_data': '2013-08-19', 'y_data': 859}, {'x_data': '2013-08-16', 'y_data': 112}, {'x_data': '2013-08-15', 'y_data': 219}, {'x_data': '2013-08-14', 'y_data': 101}, {'x_data': '2013-08-12', 'y_data': 40}, {'x_data': '2013-08-07', 'y_data': 105}, {'x_data': '2013-08-06', 'y_data': 238}, {'x_data': '2013-08-05', 'y_data': 65}]}, 'mark': {'type': 'line', 'interpolate': 'monotone'}, 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'installation_date', 'sort': 'descending'}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'COUNT(installation_date)'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
