
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': '1970', 'y_data': 3441}, {'x_data': '1971', 'y_data': 2960}, {'x_data': '1972', 'y_data': 3237}, {'x_data': '1973', 'y_data': 3419}, {'x_data': '1974', 'y_data': 2877}, {'x_data': '1975', 'y_data': 3176}, {'x_data': '1976', 'y_data': 3078}, {'x_data': '1977', 'y_data': 2997}, {'x_data': '1978', 'y_data': 2861}, {'x_data': '1979', 'y_data': 3055}, {'x_data': '1980', 'y_data': 2436}, {'x_data': '1981', 'y_data': 2532}, {'x_data': '1982', 'y_data': 2453}]}, 'mark': {'type': 'line', 'interpolate': 'monotone'}, 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'Year', 'sort': 'ascending'}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'SUM(avg(Weight))'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
