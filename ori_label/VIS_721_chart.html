
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': 'Tabatha Gehling', 'y_data': 2}, {'x_data': 'Nita Coster', 'y_data': 8}, {'x_data': 'Loraine NygrenTania Mattioli', 'y_data': 11}, {'x_data': 'Kurt Walser', 'y_data': 9}, {'x_data': 'Kelly Clauss', 'y_data': 3}, {'x_data': 'Jessie Eichman', 'y_data': 6}, {'x_data': 'Jessie Alloway', 'y_data': 4}, {'x_data': 'Ericka Dieter', 'y_data': 10}, {'x_data': 'Edwina Burnam', 'y_data': 1}, {'x_data': 'Allie Rogalski', 'y_data': 7}, {'x_data': 'Alana Bregman', 'y_data': 5}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'contestant_name', 'sort': 'ascending'}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'contestant_number'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
