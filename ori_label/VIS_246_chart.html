
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Visualization</title>
    <!-- 引入 Vega、Vega-Lite 和 Vega-Embed 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5.16.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@4.16.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.12.2"></script>
    <!-- 引入外部的 controls.js 文件 -->
    <script src="controls.js"></script>
    <style>
        .vega-actions a {
            margin-right: 5px;
        }
        .vis-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="vis1" class="vis-container"></div>
    <script>
        var vlSpec1  = {'data': {'values': [{'x_data': '603.123.6666', 'y_data': 6000}, {'x_data': '515.123.8888', 'y_data': 10000}, {'x_data': '515.123.8181', 'y_data': 8300}, {'x_data': '515.123.8080', 'y_data': 12000}, {'x_data': '515.123.7777', 'y_data': 6500}, {'x_data': '515.123.5555', 'y_data': 13000}, {'x_data': '011.44.1644.429263', 'y_data': 7000}]}, 'mark': 'bar', 'encoding': {'x': {'field': 'x_data', 'type': 'nominal', 'title': 'PHONE_NUMBER', 'sort': 'descending'}, 'y': {'field': 'y_data', 'type': 'quantitative', 'title': 'SALARY'}}}
        vegaEmbed('#vis1', vlSpec1).catch(console.error);
    </script>
</body>
</html>
